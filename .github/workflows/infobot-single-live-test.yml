name: Infobot single live post

on:
  push:
    branches:
      - codex/single-live-post-2026-10-19
    paths:
      - .github/workflows/infobot-single-live-test.yml

permissions:
  contents: read

concurrency:
  group: respond-infobot-publishing
  cancel-in-progress: false

jobs:
  single-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install -r requirements-v2.txt
      - name: Test one-post safeguards
        run: python -m unittest -v
      - name: Publish and verify exactly one article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python live_test_once.py
