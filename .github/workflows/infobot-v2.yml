name: Infobot v2

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements-v2.txt'
      - 'config-v2.json'
      - '.github/workflows/infobot-v2.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements-v2.txt'
      - 'config-v2.json'
      - '.github/workflows/infobot-v2.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = classify; initialise = new installation; run = publish; review = save a manual decision'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - initialise
          - run
          - review
      article_url:
        description: 'For review: article URL from the live review queue or a preview'
        type: string
      review_action:
        description: 'For review: approve for the next live run, or reject'
        type: choice
        default: choose
        options: [choose, approve, reject]
      review_note:
        description: 'For review: explain the decision (10-1000 characters)'
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: respond-infobot-publishing
  cancel-in-progress: false

jobs:
  checks:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      vars.INFOBOT_V2_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: |
          python -m pip install -r requirements-v2.txt
          python -m unittest -v
      - name: Show automatic posting settings
        env:
          V2_ENABLED: ${{ vars.INFOBOT_V2_ENABLED == 'true' }}
        run: |
          echo "V2 automatic posting: $V2_ENABLED"

  classify:
    needs: checks
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.INFOBOT_V2_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Download repository
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # Live jobs can wait in the concurrency queue or be retried later.
          # Read current history from the default branch before any publication.
          # Preview continues to inspect the originally requested revision.
          ref: ${{ github.ref_name == github.event.repository.default_branch && inputs.mode != 'preview' && github.event.repository.default_branch || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies and verify checked-out version
        run: |
          python -m pip install -r requirements-v2.txt
          python -m unittest -v
      - name: Classify or publish
        id: bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          INFOBOT_MODE: ${{ github.event_name != 'workflow_dispatch' && 'run' || inputs.mode }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
          REVIEW_URL: ${{ inputs.article_url }}
          REVIEW_ACTION: ${{ inputs.review_action }}
          REVIEW_NOTE: ${{ inputs.review_note }}
        run: |
          if [ "$INFOBOT_MODE" != "preview" ] && [ "$IS_DEFAULT_BRANCH" != "true" ]; then
            echo "Initialisation and publishing require the default branch. Use preview on development branches."
            exit 1
          fi
          if [ "$INFOBOT_MODE" = "review" ]; then
            python infobot_v2.py --mode review --article-url "$REVIEW_URL" --review-action "$REVIEW_ACTION" --review-note "$REVIEW_NOTE"
          else
            python infobot_v2.py --mode "$INFOBOT_MODE"
          fi
      - name: Save v2 history
        if: >-
          always() && steps.checkout.outcome == 'success' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name != 'workflow_dispatch' || inputs.mode != 'preview')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f data/state-v2.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/state-v2.json
          if [ -f data/review-queue.md ]; then
            git add -- data/review-queue.md
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Infobot v2 article history [skip ci]"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Save classification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: infobot-v2-decisions
          path: reports/latest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Show review queue
        if: always()
        run: |
          if [ -f data/review-queue.md ]; then
            cat data/review-queue.md >> "$GITHUB_STEP_SUMMARY"
          fi
