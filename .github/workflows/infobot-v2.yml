name: Infobot v2

on:
  pull_request:
    paths:
      - '*.py'
      - 'requirements-v2.txt'
      - 'config-v2.json'
      - '.github/workflows/infobot-v2.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = classification only; initialise = migrate history, no posts; run = publish approved new stories'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - initialise
          - run
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: respond-infobot-publishing
  cancel-in-progress: false

jobs:
  checks:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (vars.INFOBOT_V2_ENABLED == 'true' && vars.INFOBOT_ENABLED != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline regression and v2 tests
        run: |
          python -m pip install -r requirements-v2.txt
          python -m unittest -v

  classify:
    needs: checks
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.INFOBOT_V2_ENABLED == 'true' && vars.INFOBOT_ENABLED != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Download repository
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install -r requirements-v2.txt
      - name: Classify or publish
        id: bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          INFOBOT_ENABLED: ${{ vars.INFOBOT_ENABLED }}
          INFOBOT_MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          if [ "$INFOBOT_MODE" != "preview" ] && [ "$IS_DEFAULT_BRANCH" != "true" ]; then
            echo "Initialisation and publishing require the default branch. Use preview on development branches."
            exit 1
          fi
          python infobot_v2.py --mode "$INFOBOT_MODE"
      - name: Save v2 history
        if: >-
          always() && steps.checkout.outcome == 'success' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || inputs.mode != 'preview')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f data/state-v2.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/state-v2.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Infobot v2 article history [skip ci]"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Save classification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infobot-v2-decisions
          path: reports/latest.json
          if-no-files-found: ignore
          retention-days: 14
