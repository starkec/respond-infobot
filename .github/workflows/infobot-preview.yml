# After upload, rename this file in GitHub to:
# .github/workflows/infobot-preview.yml
name: Infobot preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infobot-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download repository files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check the code
        run: python -m unittest -v

      - name: Preview feed and check Bluesky login
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python infobot.py --check-login
