name: Infobot v2 one-time preview

on:
  push:
    branches:
      - codex/multi-feed-corruption-filter
    paths:
      - .github/workflows/infobot-v2-trial.yml

permissions:
  contents: read

concurrency:
  group: respond-infobot-v2-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest -v
      - name: Classify articles without publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python infobot_v2.py --mode preview
      - name: Save preview decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infobot-v2-first-preview
          path: reports/latest.json
          if-no-files-found: ignore
          retention-days: 14
